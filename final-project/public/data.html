<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PathSense — Data Viewer</title>
  <link rel="stylesheet" href="/css/bauhaus.css" />
  <style>
    html, body { height: 100%; background: var(--cream); color: var(--black); overflow: hidden; }
    body { font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; }

    #topbar {
      background: var(--black); padding: 11px 20px;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    #topbar-wordmark {
      font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800;
      color: var(--cream); letter-spacing: 0.16em;
    }
    #topbar-wordmark span {
      font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 300;
      color: var(--gray); letter-spacing: 0.1em; margin-left: 10px;
    }
    #topbar-right { display: flex; align-items: center; gap: 10px; }

    .bh-red-stripe { height: 3px; background: var(--red); flex-shrink: 0; }

    #toolbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
      border-bottom: 1px solid var(--rule); flex-shrink: 0; background: var(--cream);
    }
    #count-label {
      font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--gray);
      margin-left: auto;
    }

    .tb-btn {
      padding: 8px 16px; border: 1.5px solid var(--black); background: transparent;
      font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
      color: var(--black); letter-spacing: 0.1em; cursor: pointer; text-decoration: none;
      display: inline-block;
    }
    .tb-btn:hover { background: #ede9e2; }
    .tb-btn.red { border-color: var(--red); color: var(--red); }
    .tb-btn.red:hover { background: #fdf0f0; }

    #filter-row {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--gray);
    }
    #filter-status {
      padding: 6px 10px; border: 1px solid var(--rule); background: transparent;
      font-family: 'Barlow', sans-serif; font-size: 13px; color: var(--black);
    }

    #scroll-area { flex: 1; overflow-y: auto; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--red);
      padding: 10px 14px; text-align: left; border-bottom: 2px solid var(--rule);
      position: sticky; top: 0; background: var(--cream); white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--rule); }
    tbody tr:hover { background: #f5f2ec; }
    tbody td {
      padding: 10px 14px; font-family: 'Barlow', sans-serif; font-size: 13px;
      vertical-align: top;
    }

    .cell-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
    .cell-meta { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .badge {
      display: inline-block; padding: 2px 8px;
      font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .badge-haptic  { background: #e8f4fc; color: #1a7ab5; }
    .badge-audio   { background: #eef7ee; color: #2e7d32; }
    .badge-none    { background: #f5f5f5; color: #888; }
    .badge-accepted  { background: #eef7ee; color: #2e7d32; }
    .badge-discarded { background: #fdecea; color: var(--red); }
    .badge-pending   { background: #fff8e1; color: #c07c00; }

    .round-cell { display: flex; gap: 8px; flex-wrap: wrap; }
    .round-box {
      border: 1px solid var(--rule); padding: 4px 8px; min-width: 80px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 12px;
    }
    .round-box .rb-lvl {
      font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; color: var(--red); margin-bottom: 2px;
    }
    .round-box .rb-falls { font-size: 15px; font-weight: 600; }
    .round-box .rb-cp { color: var(--gray); font-size: 11px; }

    .survey-text {
      font-size: 11px; color: var(--gray); font-style: italic;
      max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    #empty-msg {
      padding: 60px 20px; text-align: center;
      font-family: 'Barlow', sans-serif; font-size: 15px; color: #bbb;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div id="topbar-wordmark">PATHSENSE <span>DATA VIEWER</span></div>
    <div id="topbar-right">
      <a href="/admin" class="tb-btn">← ADMIN</a>
      <a href="/download-db" download class="tb-btn red">↓ DOWNLOAD DB</a>
    </div>
  </div>
  <div class="bh-red-stripe"></div>

  <div id="toolbar">
    <div id="filter-row">
      Filter:
      <select id="filter-status" onchange="applyFilter()">
        <option value="">All</option>
        <option value="accepted">Accepted</option>
        <option value="discarded">Discarded</option>
        <option value="pending">Pending</option>
      </select>
    </div>
    <button class="tb-btn" onclick="loadData()">↻ REFRESH</button>
    <span id="count-label">—</span>
  </div>

  <div id="scroll-area">
    <table id="data-table">
      <thead>
        <tr>
          <th>Participant</th>
          <th>Modality</th>
          <th>Status</th>
          <th>Levels</th>
          <th>Device</th>
          <th>Survey</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="empty-msg" style="display:none">No sessions recorded yet.</div>
  </div>

  <script src="/js/data.js"></script>
</body>
</html>
