<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Body Schema Hack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f; color: #e0e0e0;
      font-family: 'Courier New', monospace;
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* ── Top bar ────────────────────────────────────────────── */
    #topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 24px; border-bottom: 1px solid #111;
      flex-shrink: 0;
    }
    .topbar-title { font-size: 11px; letter-spacing: 4px; color: #aaa; text-transform: uppercase; }
    #phase-badge {
      font-size: 10px; letter-spacing: 2px; padding: 4px 10px;
      border-radius: 20px; text-transform: uppercase;
      background: #1a1a1a; color: #999; border: 1px solid #2a2a2a;
    }
    #phase-badge.lobby  { background: #001a0a; color: #00ff88; border-color: #00ff8833; }
    #phase-badge.game   { background: #1a0000; color: #ff4455; border-color: #ff445533; }
    .topbar-spacer { flex: 1; }
    #round-label { font-size: 11px; color: #aaa; letter-spacing: 2px; }

    /* ── Main layout ────────────────────────────────────────── */
    #main {
      flex: 1; display: flex; overflow: hidden;
    }

    /* ── Left column: QR + controls ────────────────────────── */
    #col-left {
      width: 280px; min-width: 240px; flex-shrink: 0;
      display: flex; flex-direction: column;
      padding: 24px 20px; gap: 20px;
      border-right: 1px solid #111; overflow-y: auto;
    }

    .section-label {
      font-size: 9px; letter-spacing: 3px; color: #aaa;
      text-transform: uppercase; margin-bottom: 10px;
    }

    #qr-single {
      width: 160px; height: 160px; border: 2px solid #1a1a2a;
      border-radius: 10px; image-rendering: pixelated; background: #111;
      display: block; margin: 0 auto;
    }
    #url-single {
      font-size: 10px; color: #888; letter-spacing: 1px;
      text-align: center; word-break: break-all; margin-top: 6px;
    }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-family: 'Courier New', monospace; font-size: 14px;
      font-weight: bold; letter-spacing: 2px; cursor: pointer;
      text-transform: uppercase;
    }
    .btn-primary { background: #00ff88; color: #0a0a0f; }
    .btn-primary:hover:not(:disabled) { background: #00dd77; }
    .btn-primary:disabled { background: #0d2a1a; color: #0d3a1a; cursor: not-allowed; }

    .btn-secondary {
      background: transparent; color: #999; border: 1px solid #333;
    }
    .btn-secondary:hover { color: #aaa; border-color: #333; }

    .btn-danger {
      background: transparent; color: #ff4455; border: 1px solid #ff445522;
    }
    .btn-danger:hover { background: #ff445511; }

    .level-btn {
      width: 100%; padding: 12px; border: 1px solid #00ff8844; border-radius: 10px;
      font-family: 'Courier New', monospace; font-size: 13px;
      font-weight: bold; letter-spacing: 2px; cursor: pointer;
      text-transform: uppercase; background: #001a0a; color: #00ff88;
      transition: background 0.15s;
    }
    .level-btn:hover:not(:disabled) { background: #003318; }
    .level-btn:disabled { background: #0a0a0a; color: #333; border-color: #1a1a1a; cursor: not-allowed; }
    .level-btn.done { background: #0a1a0a; color: #446644; border-color: #2a3a2a; }

    /* ── Middle column: players ─────────────────────────────── */
    #col-mid {
      flex: 1; display: flex; flex-direction: column;
      padding: 24px 20px; gap: 12px; overflow: hidden;
    }

    #player-header {
      display: flex; align-items: baseline; justify-content: space-between;
      flex-shrink: 0;
    }
    #player-count { font-size: 11px; color: #aaa; letter-spacing: 2px; }

    #player-list {
      flex: 1; overflow-y: auto; display: flex;
      flex-direction: column; gap: 6px;
    }

    .player-empty {
      color: #555; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; text-align: center; margin-top: 40px;
    }

    .player-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: #0d0d12;
      border-left: 3px solid #333; border-radius: 8px;
    }
    .pr-num     { font-size: 13px; font-weight: bold; min-width: 24px; }
    .pr-name    { font-size: 15px; font-weight: bold; flex: 1; }
    .pr-mod     { font-size: 11px; color: #888; letter-spacing: 1px; min-width: 72px; text-align: right; }
    .pr-session { font-size: 10px; color: #666; letter-spacing: 1px; min-width: 56px; text-align: right; }

    /* ── Right column: results ──────────────────────────────── */
    #col-right {
      width: 320px; min-width: 260px; flex-shrink: 0;
      display: flex; flex-direction: column;
      padding: 24px 20px; gap: 12px;
      border-left: 1px solid #111; overflow-y: auto;
    }

    #results-title { font-size: 13px; color: #e0e0e0; letter-spacing: 2px; }

    #results-panel {
      flex: 1; display: flex; flex-direction: column; gap: 8px;
    }

    .results-empty {
      color: #555; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; text-align: center; margin-top: 40px;
    }

    .result-round { margin-bottom: 16px; }
    .result-round-label {
      font-size: 9px; letter-spacing: 3px; color: #aaa;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .result-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 6px; background: #0d0d12;
    }
    .rr-rank  { font-size: 14px; min-width: 20px; }
    .rr-name  { font-size: 13px; font-weight: bold; flex: 1; }
    .rr-score { font-size: 12px; color: #666; }
    .rr-mod   { font-size: 11px; color: #888; min-width: 20px; text-align: right; }

    /* ── Notification toast ─────────────────────────────────── */
    #notification {
      display: none; position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%); background: #0f0f18;
      border: 1px solid #333; border-radius: 8px;
      padding: 10px 20px; font-size: 13px; letter-spacing: 1px;
      z-index: 500; pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ══ Top bar ════════════════════════════════════════════════════════════ -->
  <div id="topbar">
    <div class="topbar-title">Body Schema Hack</div>
    <div id="phase-badge" class="lobby">Lobby</div>
    <div class="topbar-spacer"></div>
    <div id="round-label">Round 0</div>
  </div>

  <!-- ══ Main ═══════════════════════════════════════════════════════════════ -->
  <div id="main">

    <!-- ── Left: QR + controls ────────────────────────────── -->
    <div id="col-left">

      <div>
        <div class="section-label">Join Link</div>
        <img id="qr-single" src="" alt="QR" />
        <div id="url-single"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;">
        <div id="level-btns" style="display:flex;flex-direction:column;gap:8px;"></div>
        <button id="lobby-btn"  class="btn btn-secondary" onclick="adminBackToLobby()" style="display:none">← Back to Lobby</button>
        <a      id="export-btn" class="btn btn-secondary" href="/export-csv" download style="text-align:center;text-decoration:none">↓ Export CSV</a>
      </div>

      <div style="font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase;text-align:center;line-height:1.8">
        Single-player study<br>1 participant per session
      </div>
    </div>

    <!-- ── Middle: player list ────────────────────────────── -->
    <div id="col-mid">
      <div id="player-header">
        <div class="section-label" style="margin:0">Connected Players</div>
        <div id="player-count">0 / 1</div>
      </div>
      <div id="player-list">
        <div class="player-empty">No players connected yet</div>
      </div>
    </div>

    <!-- ── Right: round results ───────────────────────────── -->
    <div id="col-right">
      <div id="results-title" class="section-label">Round Results</div>
      <div id="results-panel">
        <div class="results-empty">Results will appear here after each round</div>
      </div>
    </div>

  </div>

  <!-- ══ Toast ══════════════════════════════════════════════════════════════ -->
  <div id="notification"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
