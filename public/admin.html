<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PathSense — Admin</title>
  <link rel="stylesheet" href="/css/bauhaus.css" />
  <style>
    html, body { height: 100%; background: var(--cream); color: var(--black); overflow: hidden; }
    body { font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; }

    /* ── Top bar ── */
    #topbar {
      background: var(--black);
      padding: 11px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #topbar-wordmark {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--cream);
      letter-spacing: 0.16em;
    }
    #topbar-wordmark span {
      font-family: 'Barlow', sans-serif;
      font-size: 9px;
      font-weight: 300;
      color: var(--gray);
      letter-spacing: 0.1em;
      margin-left: 10px;
    }
    #topbar-right { display: flex; align-items: center; gap: 12px; }
    #round-label {
      font-family: 'Barlow', sans-serif;
      font-size: 8px;
      font-weight: 300;
      color: var(--gray);
      letter-spacing: 0.1em;
    }
    #phase-badge {
      font-family: 'Syne', sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 3px 10px;
      color: var(--black);
      background: var(--rule);
    }
    #phase-badge.game { background: var(--red); color: #fff; }

    /* ── Red stripe ── */
    .bh-red-stripe { height: 3px; background: var(--red); flex-shrink: 0; }

    /* ── 3-column body ── */
    #main {
      flex: 1;
      display: grid;
      grid-template-columns: 210px 1fr 1fr;
      overflow: hidden;
    }
    .admin-col {
      padding: 14px 16px;
      border-right: 1px solid var(--rule);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admin-col:last-child { border-right: none; }
    .col-title {
      font-family: 'Barlow', sans-serif;
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 2px;
    }

    /* ── Participant card ── */
    .player-card {
      border-left: 3px solid var(--red);
      padding: 8px 10px;
      background: #ede9e2;
    }
    .player-name {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--black);
    }
    .player-meta {
      font-family: 'Barlow', sans-serif;
      font-size: 7.5px;
      font-weight: 300;
      color: var(--gray);
      margin-top: 2px;
    }
    .player-empty {
      font-family: 'Barlow', sans-serif;
      font-size: 9px;
      color: #bbb;
      letter-spacing: 0.08em;
    }

    /* ── QR ── */
    #qr-single {
      width: 90px; height: 90px;
      image-rendering: pixelated;
      background: #eee;
      display: block;
    }
    #url-single {
      font-family: 'Barlow', sans-serif;
      font-size: 7px;
      color: var(--gray);
      word-break: break-all;
      margin-top: 4px;
    }

    /* ── Level buttons ── */
    .level-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid var(--black);
      padding: 8px 10px;
      cursor: pointer;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: background 0.1s;
    }
    .level-btn:hover:not(:disabled) { background: #ede9e2; }
    .level-btn:disabled { border-color: var(--rule); cursor: not-allowed; }
    .level-btn.done { border-color: var(--rule); }
    .lvl-num {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--black);
      line-height: 1;
      min-width: 22px;
    }
    .level-btn.done .lvl-num { color: var(--rule); }
    .lvl-title {
      font-family: 'Syne', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--black);
    }
    .lvl-desc {
      font-family: 'Barlow', sans-serif;
      font-size: 7.5px;
      font-weight: 300;
      color: var(--gray);
      margin-top: 1px;
    }
    .level-btn.done .lvl-title,
    .level-btn.done .lvl-desc { color: var(--rule); }

    #lobby-btn {
      border: 1px solid var(--rule);
      padding: 7px 10px;
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    #lobby-btn-label {
      font-family: 'Barlow', sans-serif;
      font-size: 8px;
      color: var(--gray);
    }
    #lobby-btn-action {
      font-family: 'Syne', sans-serif;
      font-size: 8px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.1em;
    }

    /* ── Results ── */
    .result-round-label {
      font-family: 'Barlow', sans-serif;
      font-size: 7px;
      color: var(--gray);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .result-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid var(--rule);
    }
    .result-entry:last-child { border-bottom: none; }
    .re-name {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--black);
    }
    .re-meta {
      font-family: 'Barlow', sans-serif;
      font-size: 7.5px;
      color: var(--gray);
    }
    .re-falls {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--red);
    }
    .results-empty {
      font-family: 'Barlow', sans-serif;
      font-size: 9px;
      color: #bbb;
      letter-spacing: 0.08em;
    }

    /* ── Export ── */
    .export-btn {
      border: 1.5px solid var(--black);
      padding: 7px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      display: block;
      font-family: 'Syne', sans-serif;
      font-size: 8px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: 0.1em;
    }
    .export-btn:hover { background: #ede9e2; }

    /* ── Toast ── */
    #notification {
      display: none; position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%); background: var(--black);
      color: var(--cream); border: 1px solid var(--red);
      padding: 8px 18px; font-family: 'Barlow', sans-serif;
      font-size: 11px; z-index: 500; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div id="topbar-wordmark">PATHSENSE <span>RESEARCHER PANEL</span></div>
    <div id="topbar-right">
      <div id="round-label">Round 0</div>
      <div id="phase-badge">LOBBY</div>
    </div>
  </div>
  <div class="bh-red-stripe"></div>

  <div id="main">

    <!-- Col 1: Participant + QR -->
    <div class="admin-col">
      <div class="col-title">Participant</div>
      <div id="player-list"><div class="player-empty">No player connected yet</div></div>

      <div class="bh-thin-rule"></div>

      <div class="col-title">Controller QR</div>
      <img id="qr-single" src="" alt="QR" />
      <div id="url-single"></div>
    </div>

    <!-- Col 2: Levels -->
    <div class="admin-col">
      <div class="col-title">Levels</div>
      <div id="level-btns" style="display:flex;flex-direction:column;gap:6px;"></div>
      <div id="lobby-btn" onclick="adminBackToLobby()" style="display:none">
        <div id="lobby-btn-label">Session reset</div>
        <div id="lobby-btn-action">→ LOBBY</div>
      </div>
    </div>

    <!-- Col 3: Results + Export -->
    <div class="admin-col">
      <div class="col-title">Results</div>
      <div id="results-panel">
        <div class="results-empty">Results appear here after each round</div>
      </div>
      <div style="display:flex;gap:5px;margin-top:auto;padding-top:10px">
        <a href="/export-csv"    download class="export-btn" style="flex:1">↓ CSV</a>
        <a href="/export-survey" download class="export-btn" style="flex:1">↓ SURVEY</a>
      </div>
    </div>

  </div>

  <div id="notification"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
