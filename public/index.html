<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body Dodge — Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f; color: #e0e0e0;
      font-family: 'Courier New', monospace;
      height: 100vh; overflow: hidden;
    }

    /* ── Views ──────────────────────────────────────────────── */
    .view, #game-container {
      display: none; width: 100%; height: 100vh;
    }
    .view.active, #game-container.active { display: flex; }

    /* ── Waiting screen ─────────────────────────────────────── */
    #view-waiting {
      flex-direction: column; align-items: center; justify-content: center;
      gap: 48px;
    }

    .waiting-wordmark {
      font-size: 11px; letter-spacing: 6px; color: #666;
      text-transform: uppercase;
    }

    .waiting-title {
      font-size: clamp(36px, 5vw, 72px);
      font-weight: bold; letter-spacing: 8px; text-transform: uppercase;
      color: #e0e0e0;
      text-shadow: 0 0 40px rgba(0,207,255,0.15);
    }

    .waiting-title span {
      color: #00cfff;
      text-shadow: 0 0 30px #00cfff88;
    }

    #waiting-player-count {
      font-size: 13px; letter-spacing: 3px; color: #aaa;
      text-transform: uppercase;
    }

    #waiting-player-dots {
      display: flex; gap: 32px; align-items: flex-end;
      min-height: 90px; flex-wrap: wrap; justify-content: center;
      max-width: 800px;
    }

    .waiting-dot-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
    }

    .waiting-dot {
      width: 48px; height: 48px; border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.12); opacity: 0.8; }
    }

    .waiting-dot-label {
      font-size: 12px; letter-spacing: 2px; font-weight: bold;
      text-transform: uppercase;
    }

    .waiting-hint {
      font-size: 11px; color: #555; letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── Game container ─────────────────────────────────────── */
    #game-container {
      position: relative; background: #000;
      justify-content: center; align-items: center;
    }

    /* ── Live leaderboard overlay ───────────────────────────── */
    #live-lb {
      display: none; position: fixed; top: 12px; right: 12px;
      background: rgba(10,10,15,0.88); border: 1px solid #1e1e2e;
      border-radius: 10px; padding: 10px 14px; min-width: 160px;
      z-index: 200; backdrop-filter: blur(4px);
    }
    #live-lb.visible { display: block; }
    #live-lb-title {
      font-size: 9px; letter-spacing: 3px; color: #aaa;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .lb-row {
      font-size: 13px; font-weight: bold; letter-spacing: 1px;
      padding: 2px 0;
    }

    /* ── Round results ──────────────────────────────────────── */
    #view-round-results {
      flex-direction: column; align-items: center; justify-content: center;
      gap: 32px; padding: 40px;
    }

    #rr-title {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: bold; letter-spacing: 6px;
      text-transform: uppercase; color: #00ff88;
      text-shadow: 0 0 30px #00ff8866;
    }

    #rr-table {
      width: 100%; max-width: 700px; border-collapse: collapse;
    }
    #rr-table th {
      font-size: 10px; letter-spacing: 3px; color: #888;
      text-transform: uppercase; padding: 8px 16px;
      border-bottom: 1px solid #222; text-align: left;
    }
    #rr-table td {
      padding: 14px 16px;
      font-size: clamp(16px, 2vw, 22px);
      letter-spacing: 1px;
      border-bottom: 1px solid #0d0d14;
    }
    .rr-rank  { font-size: 22px !important; width: 48px; }
    .rr-unit  { font-size: 11px; color: #888; }

    #rr-countdown {
      font-size: 12px; color: #888; letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── Notification toast ─────────────────────────────────── */
    #notification {
      display: none; position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%); background: #0f0f18;
      border: 1px solid #333; border-radius: 10px;
      padding: 12px 24px; font-size: 14px; letter-spacing: 1px;
      z-index: 500; pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ══ Waiting ════════════════════════════════════════════════════════════ -->
  <div id="view-waiting" class="view active">
    <div class="waiting-wordmark">Body Schema Hack</div>
    <div class="waiting-title">BODY<span>DODGE</span></div>
    <div id="waiting-player-count">Waiting for players…</div>
    <div id="waiting-player-dots"></div>
    <div class="waiting-hint">Researcher controls the game from the admin panel</div>
  </div>

  <!-- ══ Game ═══════════════════════════════════════════════════════════════ -->
  <div id="game-container"></div>

  <!-- ══ Live leaderboard overlay ══════════════════════════════════════════ -->
  <div id="live-lb">
    <div id="live-lb-title">Live</div>
    <div id="live-lb-list"></div>
  </div>

  <!-- ══ Round results ══════════════════════════════════════════════════════ -->
  <div id="view-round-results" class="view">
    <div id="rr-title">Round Complete</div>

    <table id="rr-table">
      <thead>
        <tr>
          <th></th>
          <th>Player</th>
          <th>Score</th>
          <th>Gems</th>
          <th>Wall Hits</th>
          <th>Mode</th>
        </tr>
      </thead>
      <tbody id="rr-rankings"></tbody>
    </table>

    <div id="rr-countdown">Returning in 15s</div>
  </div>

  <!-- ══ Toast ══════════════════════════════════════════════════════════════ -->
  <div id="notification"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
